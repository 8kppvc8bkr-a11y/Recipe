<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Kitchen Note - 自分用レシピ＆1週間献立ブック</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-group">
        <span class="logo-badge">🍳</span>
        <div>
          <h1 class="site-title">My Kitchen Note</h1>
          <p class="site-subtitle">自分だけの美味しい記録と献立表</p>
        </div>
      </div>

      <!-- 画面切り替えナビ -->
      <nav class="main-nav">
        <button class="nav-tab-btn active" data-view="recipesView">📖 レシピ一覧</button>
        <button class="nav-tab-btn" data-view="plannerView">📅 1週間献立＆買い物</button>
      </nav>

      <button class="btn-primary" id="openAddModalBtn">＋ レシピを追加</button>
    </div>
  </header>

  <!-- ==================== ビュー1：レシピ一覧 ==================== -->
  <main class="container view-section active" id="recipesView">
    <!-- 検索＆フィルターバー -->
    <section class="filter-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="料理名・材料・メモで検索...">
      </div>

      <div class="filter-controls">
        <div class="category-tabs" id="categoryTabs">
          <button class="tab-btn active" data-category="すべて">すべて</button>
          <button class="tab-btn" data-category="主菜">主菜</button>
          <button class="tab-btn" data-category="副菜">副菜</button>
          <button class="tab-btn" data-category="汁物">汁物</button>
          <button class="tab-btn" data-category="主食">主食</button>
          <button class="tab-btn" data-category="その他">その他</button>
        </div>
        <button class="fav-filter-btn" id="favFilterBtn">♡ お気に入りのみ</button>
      </div>
    </section>

    <div class="list-status">
      <span id="recipeCount">全 0 品のレシピ</span>
    </div>

    <section class="recipe-grid" id="recipeGrid"></section>
  </main>

  <!-- ==================== ビュー2：1週間献立＆買い物リスト ==================== -->
  <main class="container view-section" id="plannerView">
    <div class="planner-header">
      <div>
        <h2 class="section-main-title">今週の一汁三菜プランナー</h2>
        <p class="section-sub-desc">各曜日の枠をタップしてレシピを割り当てると、下の買い物リストに1週間分の材料が自動集計されます。</p>
      </div>
      <div class="planner-actions">
        <div class="planner-servings-box">
          <span>作る人数：</span>
          <button class="step-serv-btn" id="planServDown">−</button>
          <strong id="planServDisplay">2人分</strong>
          <button class="step-serv-btn" id="planServUp">＋</button>
        </div>
        <button class="btn-danger-outline" id="clearWeekBtn">献立をリセット</button>
      </div>
    </div>

    <!-- 1週間（月〜日）一汁三菜グリッド -->
    <section class="week-grid" id="weekGrid"></section>

    <!-- 1週間分の買い物リスト -->
    <section class="shopping-section">
      <div class="shopping-header">
        <div>
          <h3 class="shopping-title">🛒 今週のまとめて買い物リスト（<span id="shoppingServLabel">2人分</span>換算）</h3>
          <p class="shopping-sub">同じ材料・単位は自動で合算されます。タップでカゴに入れたチェックができます。</p>
        </div>
        <div class="shopping-btns">
          <button class="btn-outline" id="copyShoppingBtn">📋 リストをコピー</button>
          <button class="btn-outline" id="uncheckAllShoppingBtn">チェック解除</button>
        </div>
      </div>

      <div class="shopping-list-wrap" id="shoppingListContainer"></div>
    </section>
  </main>

  <!-- ==================== モーダル1：献立枠のレシピ選択 ==================== -->
  <div class="modal-overlay" id="slotPickerModal">
    <div class="modal-card picker-modal-card">
      <div class="modal-top-actions">
        <div>
          <span class="badge-category" id="pickerSlotLabel">月曜日・主菜</span>
          <h2 class="form-modal-title" style="margin-top: 6px;">献立に入れるレシピを選択</h2>
        </div>
        <button class="close-btn" id="closePickerModalBtn">✕</button>
      </div>

      <div class="picker-search-row">
        <input type="text" id="pickerSearchInput" placeholder="レシピ名・材料で絞り込み...">
        <button class="btn-danger-outline" id="clearSlotBtn">この枠を空にする</button>
      </div>

      <div class="picker-recipe-list" id="pickerRecipeList"></div>
    </div>
  </div>

  <!-- ==================== モーダル2：レシピ詳細 ==================== -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card detail-modal-card">
      <div class="modal-top-actions">
        <div class="detail-badges">
          <span class="badge-category" id="detailCategory">カテゴリ</span>
        </div>
        <div class="modal-icon-btns">
          <button class="icon-btn" id="detailFavBtn" title="お気に入り">♡</button>
          <button class="btn-outline" id="detailEditBtn">編集</button>
          <button class="btn-danger-outline" id="detailDeleteBtn">削除</button>
          <button class="close-btn" id="closeDetailModalBtn">✕</button>
        </div>
      </div>

      <div class="detail-hero">
        <div class="detail-visual" id="detailVisual"></div>
        <div class="detail-header-text">
          <h2 class="detail-title" id="detailTitle">料理名</h2>
          <div class="memo-box" id="detailMemoBox">
            <span class="memo-label">📌 自分用メモ・コツ</span>
            <p id="detailMemo">メモ内容</p>
          </div>
        </div>
      </div>

      <div class="detail-body-grid">
        <div class="detail-section ingredients-section">
          <div class="section-header-row">
            <h3>材料</h3>
            <div class="servings-control">
              <button class="step-serv-btn" id="decreaseServBtn">−</button>
              <span id="currentServingsDisplay">2人分</span>
              <button class="step-serv-btn" id="increaseServBtn">＋</button>
            </div>
          </div>
          <ul class="ingredient-list" id="detailIngredients"></ul>
        </div>

        <div class="detail-section steps-section">
          <div class="section-header-row">
            <h3>作り方</h3>
            <span class="hint-text">タップで完了チェック</span>
          </div>
          <ol class="step-list" id="detailSteps"></ol>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== モーダル3：レシピ追加・編集 ==================== -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-card form-modal-card">
      <div class="modal-top-actions">
        <h2 class="form-modal-title" id="formModalTitle">新しいレシピを追加</h2>
        <button class="close-btn" id="closeFormModalBtn">✕</button>
      </div>

      <form id="recipeForm" class="recipe-form">
        <input type="hidden" id="recipeId">

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="inputTitle">料理名 <span class="required">*</span></label>
            <input type="text" id="inputTitle" required placeholder="例：基本のほくほく肉じゃが">
          </div>
          <div class="form-group flex-1">
            <label for="inputCategory">一汁三菜の区分</label>
            <select id="inputCategory">
              <option value="主菜">主菜（メイン）</option>
              <option value="副菜">副菜（おかず）</option>
              <option value="汁物">汁物（スープ・味噌汁）</option>
              <option value="主食">主食（ごはん・麺・パン）</option>
              <option value="その他">その他（デザート等）</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="inputServings">基準の人数（人分）</label>
            <input type="number" id="inputServings" value="2" min="1">
          </div>
          <div class="form-group flex-2">
            <label for="inputImageFile">料理の写真を選択</label>
            <div class="photo-upload-row">
              <input type="file" id="inputImageFile" accept="image/*">
              <button type="button" class="btn-outline btn-sm" id="removePhotoBtn" style="display:none;">写真を削除</button>
            </div>
            <div class="photo-preview-box" id="photoPreviewBox" style="display:none;">
              <img id="photoPreviewImg" src="" alt="プレビュー">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="inputIngredients">材料（1行に1つ「材料名：分量 単位」の形式で入力すると自動合算されます）</label>
          <textarea id="inputIngredients" rows="5" placeholder="じゃがいも：3 個&#10;豚こま切れ肉：200 g&#10;醤油：2.5 大さじ"></textarea>
        </div>

        <div class="form-group">
          <label for="inputSteps">作り方（1行に1ステップずつ入力）</label>
          <textarea id="inputSteps" rows="5" placeholder="野菜を一口大に切る。&#10;鍋で肉と野菜を炒める。&#10;調味料と水を加えて落し蓋をし、中火で15分煮る。"></textarea>
        </div>

        <div class="form-group">
          <label for="inputMemo">自分用メモ・アレンジのコツ</label>
          <textarea id="inputMemo" rows="2" placeholder="例：仕上げにバターをひとかけ落とすとコクが増す！"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-outline" id="cancelFormBtn">キャンセル</button>
          <button type="submit" class="btn-primary">保存する</button>
        </div>
      </form>
    </div>
  </div>

      { key: 'thu', label: '木曜日' },

      { key: 'sun', label: '日曜日' }
    ];

    const SLOTS = [
      { key: 'staple', label: '主食', badgeClass: 'slot-staple' },
      { key: 'soup', label: '汁物', badgeClass: 'slot-soup' },
      { key: 'main', label: '主菜', badgeClass: 'slot-main' },
      { key: 'side1', label: '副菜①', badgeClass: 'slot-side' },
      { key: 'side2', label: '副菜②', badgeClass: 'slot-side' }
    ];

    // 状態管理
    let recipes = JSON.parse(localStorage.getItem('my_kitchen_recipes_v3')) || DEFAULT_RECIPES;
    let weeklyPlan = JSON.parse(localStorage.getItem('my_kitchen_week_plan_v1')) || createEmptyWeekPlan();
    let planServings = parseInt(localStorage.getItem('my_kitchen_plan_servings'), 10) || 2;
    let checkedShoppingItems = JSON.parse(localStorage.getItem('my_kitchen_checked_shop_v1')) || {};

    let activeCategory = 'すべて';
    let onlyFavorites = false;
    let searchQuery = '';
    let currentDetailRecipe = null;
    let currentServings = 2;
    let uploadedImageDataUrl = '';

    let editingSlot = { dayKey: null, slotKey: null };

    function createEmptyWeekPlan() {
      const plan = {};
      DAYS.forEach(d => {
        plan[d.key] = { staple: null, soup: null, main: null, side1: null, side2: null };
      });
      return plan;
    }

    function saveAll() {
      try {
        localStorage.setItem('my_kitchen_recipes_v3', JSON.stringify(recipes));
        localStorage.setItem('my_kitchen_week_plan_v1', JSON.stringify(weeklyPlan));
        localStorage.setItem('my_kitchen_plan_servings', String(planServings));
        localStorage.setItem('my_kitchen_checked_shop_v1', JSON.stringify(checkedShoppingItems));
      } catch (e) {
        alert('保存容量の上限に達しました。写真のサイズを小さくするか、不要なレシピを削除してください。');
      }
    }

    function init() {
      saveAll();
      renderRecipes();
      renderWeekPlanner();
      renderShoppingList();
      setupEventListeners();
    }

    // 写真未設定時のシンプルな表示（イラストなし）
    function getNoPhotoPlaceholder() {
      return `
        <div class="no-photo-placeholder">
          <span>NO PHOTO</span>
        </div>
      `;
    }

    // 選択した画像ファイルをリサイズしてDataURLに変換
    function resizeImageFile(file, maxWidth = 800) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ==================== レシピ一覧描画 ====================
    function renderRecipes() {
      const grid = document.getElementById('recipeGrid');
      const countEl = document.getElementById('recipeCount');

      const filtered = recipes.filter(r => {
        const matchCat = activeCategory === 'すべて' || r.category === activeCategory;
        const matchFav = !onlyFavorites || r.favorite;
        const q = searchQuery.toLowerCase();
        const matchQuery = !q ||
          r.title.toLowerCase().includes(q) ||
          (r.memo && r.memo.toLowerCase().includes(q)) ||
          r.ingredients.some(i => i.name.toLowerCase().includes(q));
        return matchCat && matchFav && matchQuery;
      });

      countEl.textContent = `全 ${filtered.length} 品のレシピ`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">条件に合うレシピが見つかりませんでした。</div>`;
        return;
      }

      grid.innerHTML = filtered.map(r => `
        <article class="recipe-card" data-id="${r.id}">
          <div class="card-thumb">
            ${r.image ? `<img src="${r.image}" alt="${r.title}">` : getNoPhotoPlaceholder()}
            <span class="card-cat-badge">${r.category}</span>
            <button class="card-fav-btn ${r.favorite ? 'is-fav' : ''}" data-fav-id="${r.id}" title="お気に入り">
              ${r.favorite ? '♥' : '♡'}
            </button>
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span>👤 ${r.servings}人分</span>
            </div>
            <h3 class="card-title">${r.title}</h3>
            ${r.memo ? `<div class="card-memo-preview">📌 ${r.memo}</div>` : ''}
          </div>
        </article>
      `).join('');
    }

    // ==================== 1週間献立プランナー描画 ====================
    function renderWeekPlanner() {
      document.getElementById('planServDisplay').textContent = `${planServings}人分`;
      document.getElementById('shoppingServLabel').textContent = `${planServings}人分`;

      const weekGrid = document.getElementById('weekGrid');
      weekGrid.innerHTML = DAYS.map(day => {
        const daySlots = weeklyPlan[day.key] || {};
        const slotsHtml = SLOTS.map(slot => {
          const recipeId = daySlots[slot.key];
          const recipe = recipes.find(r => r.id === recipeId);

          if (recipe) {
            return `
              <div class="meal-slot filled" data-day="${day.key}" data-slot="${slot.key}">
                <span class="slot-tag ${slot.badgeClass}">${slot.label}</span>
                <div class="slot-recipe-info">
                  <span class="slot-recipe-title">${recipe.title}</span>
                  <button class="slot-detail-link" data-view-recipe="${recipe.id}" title="レシピを見る">詳細</button>
                </div>
              </div>
            `;
          } else {
            return `
              <div class="meal-slot empty" data-day="${day.key}" data-slot="${slot.key}">
                <span class="slot-tag ${slot.badgeClass}">${slot.label}</span>
                <span class="slot-placeholder">＋ レシピを選ぶ</span>
              </div>
            `;
          }
        }).join('');

        return `
          <div class="day-card">
            <div class="day-card-header">
              <span class="day-name">${day.label}</span>
              <span class="day-subtitle">一汁三菜</span>
            </div>
            <div class="day-slots-list">
              ${slotsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    // ==================== 1週間分の買い物リスト自動集計 ====================
    function renderShoppingList() {
      const container = document.getElementById('shoppingListContainer');
      const aggregated = new Map();

      DAYS.forEach(day => {
        const daySlots = weeklyPlan[day.key] || {};
        SLOTS.forEach(slot => {
          const recipeId = daySlots[slot.key];
          if (!recipeId) return;
          const recipe = recipes.find(r => r.id === recipeId);
          if (!recipe) return;

          const ratio = planServings / (recipe.servings || 1);

          recipe.ingredients.forEach(ing => {
            const cleanName = ing.name.trim();
            const cleanUnit = (ing.unit || '').trim();
            const key = `${cleanName}__${cleanUnit}`;

            if (!aggregated.has(key)) {
              aggregated.set(key, {
                key,
                name: cleanName,
                unit: cleanUnit,
                totalAmount: 0,
                hasNumeric: false,
                recipes: new Set()
              });
            }

            const entry = aggregated.get(key);
            entry.recipes.add(recipe.title);

            if (ing.amount !== '' && !isNaN(ing.amount)) {
              entry.totalAmount += Number(ing.amount) * ratio;
              entry.hasNumeric = true;
            }
          });
        });
      });

      const items = Array.from(aggregated.values());

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-shopping">
            まだ今週の献立が登録されていません。上の曜日枠をクリックしてレシピを選ぶと、必要な材料がここにまとまります！
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <ul class="shopping-grid">
          ${items.map(item => {
            const isChecked = !!checkedShoppingItems[item.key];
            const amountText = item.hasNumeric
              ? `${Math.round(item.totalAmount * 10) / 10} ${item.unit}`
              : item.unit;
            const usedIn = Array.from(item.recipes).join(' / ');

            return `
              <li class="shopping-item ${isChecked ? 'checked' : ''}" data-shop-key="${item.key}">
                <div class="shop-check-box">${isChecked ? '✓' : ''}</div>
                <div class="shop-item-body">
                  <div class="shop-item-main">
                    <span class="shop-name">${item.name}</span>
                    <span class="shop-amount">${amountText}</span>
                  </div>
                  <div class="shop-used-in">使用: ${usedIn}</div>
                </div>
              </li>
            `;
          }).join('')}
        </ul>
      `;
    }

    // ==================== 献立枠のレシピ選択モーダル ====================
    function openSlotPickerModal(dayKey, slotKey) {
      editingSlot = { dayKey, slotKey };
      const dayObj = DAYS.find(d => d.key === dayKey);
      const slotObj = SLOTS.find(s => s.key === slotKey);

      document.getElementById('pickerSlotLabel').textContent = `${dayObj.label} ・ ${slotObj.label}`;
      document.getElementById('pickerSearchInput').value = '';
      renderPickerRecipeList('');
      document.getElementById('slotPickerModal').classList.add('open');
    }

    function renderPickerRecipeList(filterText) {
      const listEl = document.getElementById('pickerRecipeList');
      const q = filterText.toLowerCase();

      const slotObj = SLOTS.find(s => s.key === editingSlot.slotKey);
      const targetCat = slotObj ? slotObj.label.replace(/[①②]/g, '') : '';

      const matched = recipes.filter(r => {
        const matchCat = !targetCat || r.category === targetCat;
        const matchQuery = !q ||
          r.title.toLowerCase().includes(q) ||
          r.ingredients.some(i => i.name.toLowerCase().includes(q));
        return matchCat && matchQuery;
      });

      if (matched.length === 0) {
        listEl.innerHTML = `<p style="padding: 16px; text-align:center;">「${targetCat}」のレシピがありません</p>`;
        return;
      }

      listEl.innerHTML = matched.map(r => `
        <div class="picker-item" data-pick-id="${r.id}">
          <div>
            <span class="picker-cat-tag">${r.category}</span>
            <strong class="picker-title">${r.title}</strong>
            <p class="picker-ings">${r.ingredients.map(i => i.name).join('、')}</p>
          </div>
          <span class="picker-select-arrow">選択 →</span>
        </div>
      `).join('');
    }

    // ==================== 詳細モーダル ====================
    function openDetailModal(id) {
      const recipe = recipes.find(r => r.id === id);
      if (!recipe) return;
      currentDetailRecipe = recipe;
      currentServings = recipe.servings;

      document.getElementById('detailCategory').textContent = recipe.category;
      document.getElementById('detailTitle').textContent = recipe.title;

      const memoBox = document.getElementById('detailMemoBox');
      if (recipe.memo) {
        memoBox.style.display = 'block';
        document.getElementById('detailMemo').textContent = recipe.memo;
      } else {
        memoBox.style.display = 'none';
      }

      const visualEl = document.getElementById('detailVisual');
      visualEl.innerHTML = recipe.image
        ? `<img src="${recipe.image}" alt="${recipe.title}">`
        : getNoPhotoPlaceholder();

      updateDetailFavButton();
      renderDetailIngredients();

      const stepsEl = document.getElementById('detailSteps');
      stepsEl.innerHTML = recipe.steps.map((step, idx) => `
        <li class="step-item" onclick="this.classList.toggle('done')">
          <span class="step-num">${idx + 1}</span>
          <span class="step-text">${step}</span>
        </li>
      `).join('');

      document.getElementById('detailModal').classList.add('open');
    }

    function updateDetailFavButton() {
      const btn = document.getElementById('detailFavBtn');
      btn.textContent = currentDetailRecipe.favorite ? '♥' : '♡';
      btn.classList.toggle('is-fav', currentDetailRecipe.favorite);
    }

    function renderDetailIngredients() {
      document.getElementById('currentServingsDisplay').textContent = `${currentServings}人分`;
      const ratio = currentServings / currentDetailRecipe.servings;
      const listEl = document.getElementById('detailIngredients');

      listEl.innerHTML = currentDetailRecipe.ingredients.map(ing => {
        let calcAmount = '';
        if (ing.amount !== '' && !isNaN(ing.amount)) {
          const val = Math.round(ing.amount * ratio * 10) / 10;
          calcAmount = `${val} ${ing.unit}`;
        } else {
          calcAmount = ing.unit;
        }
        return `
          <li>
            <span class="ing-name">${ing.name}</span>
            <span class="ing-amount">${calcAmount}</span>
          </li>
        `;
      }).join('');
    }

    // ==================== 追加・編集モーダル ====================
    function updatePhotoPreview(dataUrl) {
      uploadedImageDataUrl = dataUrl || '';
      const previewBox = document.getElementById('photoPreviewBox');
      const previewImg = document.getElementById('photoPreviewImg');
      const removeBtn = document.getElementById('removePhotoBtn');

      if (uploadedImageDataUrl) {
        previewImg.src = uploadedImageDataUrl;
        previewBox.style.display = 'block';
        removeBtn.style.display = 'inline-block';
      } else {
        previewImg.src = '';
        previewBox.style.display = 'none';
        removeBtn.style.display = 'none';
      }
    }

    function openFormModal(recipe = null) {
      const form = document.getElementById('recipeForm');
      form.reset();

      if (recipe) {
        document.getElementById('formModalTitle').textContent = 'レシピを編集';
        document.getElementById('recipeId').value = recipe.id;
        document.getElementById('inputTitle').value = recipe.title;
        document.getElementById('inputCategory').value = recipe.category;
        document.getElementById('inputServings').value = recipe.servings;
        document.getElementById('inputMemo').value = recipe.memo || '';
        document.getElementById('inputIngredients').value = recipe.ingredients
          .map(i => `${i.name}：${i.amount !== '' ? i.amount + ' ' : ''}${i.unit}`)
          .join('\n');
        document.getElementById('inputSteps').value = recipe.steps.join('\n');
        updatePhotoPreview(recipe.image || '');
      } else {
        document.getElementById('formModalTitle').textContent = '新しいレシピを追加';
        document.getElementById('recipeId').value = '';
        updatePhotoPreview('');
      }

      document.getElementById('formModal').classList.add('open');
    }

    // ==================== イベントリスナー ====================
    function setupEventListeners() {
      // 上部ビュー切り替え
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const targetId = btn.dataset.view;
          document.querySelectorAll('.view-section').forEach(sec => {
            sec.classList.toggle('active', sec.id === targetId);
          });
        });
      });

      // 検索＆フィルター
      document.getElementById('searchInput').addEventListener('input', e => {
        searchQuery = e.target.value;
        renderRecipes();
      });

      document.getElementById('categoryTabs').addEventListener('click', e => {
        if (!e.target.classList.contains('tab-btn')) return;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeCategory = e.target.dataset.category;
        renderRecipes();
      });

      document.getElementById('favFilterBtn').addEventListener('click', e => {
        onlyFavorites = !onlyFavorites;
        e.target.classList.toggle('active', onlyFavorites);
        e.target.textContent = onlyFavorites ? '♥ お気に入りのみ' : '♡ お気に入りのみ';
        renderRecipes();
      });

      // 写真ファイル選択＆削除
      document.getElementById('inputImageFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const resizedDataUrl = await resizeImageFile(file);
        updatePhotoPreview(resizedDataUrl);
      });

      document.getElementById('removePhotoBtn').addEventListener('click', () => {
        document.getElementById('inputImageFile').value = '';
        updatePhotoPreview('');
      });

      // レシピカード操作
      document.getElementById('recipeGrid').addEventListener('click', e => {
        const favBtn = e.target.closest('.card-fav-btn');
        if (favBtn) {
          e.stopPropagation();
          const target = recipes.find(r => r.id === favBtn.dataset.favId);
          if (target) {
            target.favorite = !target.favorite;
            saveAll();
            renderRecipes();
          }
          return;
        }
        const card = e.target.closest('.recipe-card');
        if (card) openDetailModal(card.dataset.id);
      });

      // 1週間献立枠クリック
      document.getElementById('weekGrid').addEventListener('click', e => {
        const detailLink = e.target.closest('.slot-detail-link');
        if (detailLink) {
          e.stopPropagation();
          openDetailModal(detailLink.dataset.viewRecipe);
          return;
        }
        const slotEl = e.target.closest('.meal-slot');
        if (slotEl) {
          openSlotPickerModal(slotEl.dataset.day, slotEl.dataset.slot);
        }
      });

      // 献立人数変更
      document.getElementById('planServDown').addEventListener('click', () => {
        if (planServings > 1) {
          planServings--;
          saveAll();
          renderWeekPlanner();
          renderShoppingList();
        }
      });

      document.getElementById('planServUp').addEventListener('click', () => {
        planServings++;
        saveAll();
        renderWeekPlanner();
        renderShoppingList();
      });

      // 献立リセット
      document.getElementById('clearWeekBtn').addEventListener('click', () => {
        if (confirm('1週間分の献立をすべて空にしますか？')) {
          weeklyPlan = createEmptyWeekPlan();
          checkedShoppingItems = {};
          saveAll();
          renderWeekPlanner();
          renderShoppingList();
        }
      });

      // 買い物リストチェック＆コピー
      document.getElementById('shoppingListContainer').addEventListener('click', e => {
        const itemEl = e.target.closest('.shopping-item');
        if (!itemEl) return;
        const key = itemEl.dataset.shopKey;
        checkedShoppingItems[key] = !checkedShoppingItems[key];
        saveAll();
        renderShoppingList();
      });

      document.getElementById('uncheckAllShoppingBtn').addEventListener('click', () => {
        checkedShoppingItems = {};
        saveAll();
        renderShoppingList();
      });

      document.getElementById('copyShoppingBtn').addEventListener('click', () => {
        const items = document.querySelectorAll('.shopping-item');
        if (!items.length) return alert('買い物リストが空です。');
        const lines = Array.from(items).map(el => {
          const check = el.classList.contains('checked') ? '☑' : '☐';
          const name = el.querySelector('.shop-name').textContent;
          const amount = el.querySelector('.shop-amount').textContent;
          return `${check} ${name}（${amount}）`;
        });
        navigator.clipboard.writeText(`【今週の買い物リスト：${planServings}人分】\n` + lines.join('\n'))
          .then(() => alert('買い物リストをクリップボードにコピーしました！'));
      });

      // 献立枠選択モーダル内操作
      document.getElementById('closePickerModalBtn').addEventListener('click', () => {
        document.getElementById('slotPickerModal').classList.remove('open');
      });

      document.getElementById('pickerSearchInput').addEventListener('input', e => {
        renderPickerRecipeList(e.target.value);
      });

      document.getElementById('pickerRecipeList').addEventListener('click', e => {
        const pickEl = e.target.closest('.picker-item');
        if (!pickEl) return;
        const { dayKey, slotKey } = editingSlot;
        weeklyPlan[dayKey][slotKey] = pickEl.dataset.pickId;
        saveAll();
        renderWeekPlanner();
        renderShoppingList();
        document.getElementById('slotPickerModal').classList.remove('open');
      });

      document.getElementById('clearSlotBtn').addEventListener('click', () => {
        const { dayKey, slotKey } = editingSlot;
        weeklyPlan[dayKey][slotKey] = null;
        saveAll();
        renderWeekPlanner();
        renderShoppingList();
        document.getElementById('slotPickerModal').classList.remove('open');
      });

      // 詳細モーダル内操作
      document.getElementById('closeDetailModalBtn').addEventListener('click', () => {
        document.getElementById('detailModal').classList.remove('open');
      });

      document.getElementById('detailFavBtn').addEventListener('click', () => {
        if (!currentDetailRecipe) return;
        currentDetailRecipe.favorite = !currentDetailRecipe.favorite;
        saveAll();
        updateDetailFavButton();
        renderRecipes();
      });

      document.getElementById('decreaseServBtn').addEventListener('click', () => {
        if (currentServings > 1) {
          currentServings--;
          renderDetailIngredients();
        }
      });

      document.getElementById('increaseServBtn').addEventListener('click', () => {
        currentServings++;
        renderDetailIngredients();
      });

      document.getElementById('detailEditBtn').addEventListener('click', () => {
        document.getElementById('detailModal').classList.remove('open');
        openFormModal(currentDetailRecipe);
      });

      document.getElementById('detailDeleteBtn').addEventListener('click', () => {
        if (!currentDetailRecipe) return;
        if (confirm(`「${currentDetailRecipe.title}」を削除しますか？`)) {
          recipes = recipes.filter(r => r.id !== currentDetailRecipe.id);
          saveAll();
          renderRecipes();
          renderWeekPlanner();
          renderShoppingList();
          document.getElementById('detailModal').classList.remove('open');
        }
      });

      // 追加・編集フォーム操作
      document.getElementById('openAddModalBtn').addEventListener('click', () => openFormModal());
      document.getElementById('closeFormModalBtn').addEventListener('click', () => {
        document.getElementById('formModal').classList.remove('open');
      });
      document.getElementById('cancelFormBtn').addEventListener('click', () => {
        document.getElementById('formModal').classList.remove('open');
      });

      document.getElementById('recipeForm').addEventListener('submit', e => {
        e.preventDefault();
        const id = document.getElementById('recipeId').value;
        const rawIngredients = document.getElementById('inputIngredients').value.split('\n').filter(Boolean);
        const parsedIngredients = rawIngredients.map(line => {
          const [namePart, restPart = ''] = line.split(/[:：]/);
          const match = restPart.trim().match(/^([0-9.]+)\s*(.*)$/);
          if (match) {
            return { name: namePart.trim(), amount: parseFloat(match[1]), unit: match[2].trim() };
          }
          return { name: namePart.trim(), amount: '', unit: restPart.trim() };
        });

        const steps = document.getElementById('inputSteps').value.split('\n').map(s => s.trim()).filter(Boolean);

        const recipeData = {
          id: id || String(Date.now()),
          title: document.getElementById('inputTitle').value.trim(),
          category: document.getElementById('inputCategory').value,
          servings: parseInt(document.getElementById('inputServings').value, 10) || 2,
          image: uploadedImageDataUrl,
          memo: document.getElementById('inputMemo').value.trim(),
          ingredients: parsedIngredients.length ? parsedIngredients : [{ name: 'お好みの材料', amount: '', unit: '適量' }],
          steps: steps.length ? steps : ['材料を下ごしらえして調理する。'],
          favorite: id ? (recipes.find(r => r.id === id)?.favorite || false) : false
        };

        if (id) {
          recipes = recipes.map(r => r.id === id ? recipeData : r);
        } else {
          recipes.unshift(recipeData);
        }

        saveAll();
        renderRecipes();
        renderWeekPlanner();
        renderShoppingList();
        document.getElementById('formModal').classList.remove('open');
      });

      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', e => {
          if (e.target === overlay) overlay.classList.remove('open');
        });
      });
    }

    init();
  </script>
</body>
</html>
